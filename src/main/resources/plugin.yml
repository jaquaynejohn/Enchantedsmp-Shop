
name: EnchantedSMP
version: 1.0.0
main: com.enchanted.smp.EnchantedSMP
api-version: '1.21'
author: EnchantedSMP
description: Custom EnchantedSMP shop, shards, kits, spawners and economy plugin.

softdepend:
  - Vault
  - LuckPerms
  - PlaceholderAPI

commands:
  shop:
    description: Opens the EnchantedSMP shop.
    usage: /shop

  shard:
    description: Check and manage shard balances.
    usage: /shard
    permission: enchantedsmp.shard
    permission-message: "&cYou cannot use this command."

  ah:
    description: Opens the auction house.
    usage: /ah

  order:
    description: Opens and manages player orders.
    usage: /order

  kit:
    description: Opens the EnchantedSMP kits.
    usage: /kit
    permission: enchantedsmp.kit

permissions:
  enchantedsmp.shard:
    description: Allows checking shard balance.
    default: true

  enchantedsmp.shard.admin:
    description: Allows giving, taking and setting shards.
    default: op

  enchantedsmp.kit:
    description: Allows opening the kit menu.
    default: true

  enchantedsmp.kit.admin:
    description: Allows managing kits.
    default: op
