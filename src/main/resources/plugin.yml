
name: EnchantedSMP
version: 1.0.0
main: com.enchanted.smp.EnchantedSMP
api-version: '1.21'
author: EnchantedSMP
description: Custom EnchantedSMP plugin

softdepend:
  - Vault
  - LuckPerms

commands:
  shop:
    description: Opens the EnchantedSMP shop
    usage: /shop
    permission: enchantedsmp.shop

  shard:
    description: Check your shard balance
    usage: /shard
    permission: enchantedsmp.shard

  ah:
    description: Opens the EnchantedSMP Auction House
    usage: /ah
    permission: enchantedsmp.ah

  order:
    description: Opens player orders
    usage: /order
    permission: enchantedsmp.order

  kit:
    description: Opens the rank kits menu
    usage: /kit
    permission: enchantedsmp.kit

permissions:
  enchantedsmp.shop:
    description: Allows players to use the shop
    default: true

  enchantedsmp.shard:
    description: Allows players to check their shards
    default: true

  enchantedsmp.shard.admin:
    description: Allows shard administration
    default: op

  enchantedsmp.ah:
    description: Allows players to use the Auction House
    default: true

  enchantedsmp.order:
    description: Allows players to use player orders
    default: true

  enchantedsmp.kit:
    description: Allows players to use rank kits
    default: true

  enchantedsmp.kit.admin:
    description: Allows editing and resetting kits
    default: op
