
name: EnchantedSMP
version: 1.0.0
main: com.enchanted.smp.EnchantedSMP
api-version: '1.21'
author: EnchantedSMP
description: Custom EnchantedSMP plugin

softdepend:
  - Vault

commands:
  shop:
    description: Opens the EnchantedSMP shop
    usage: /shop
    permission: enchantedsmp.shop

  shard:
    description: Check your shard balance
    usage: /shard
    permission: enchantedsmp.shard

permissions:
  enchantedsmp.shop:
    description: Allows players to use the shop
    default: true

  enchantedsmp.shard:
    description: Allows players to check their shards
    default: true

  enchantedsmp.shard.admin:
    description: Allows shard administration
    default: op
